<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>the fuck is going on</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
      transition: background 0.4s, color 0.4s;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      transition: background 0.4s, color 0.4s;
    }

    .current {
      text-align: center;
    }

    .current-name {
      font-size: 2.2rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .since {
      color: #777;
      font-size: 0.95rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 18px 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      background: #e9e9e9;
      color: #222;
      transition: transform 0.1s, background 0.2s;
    }

    button:hover {
      background: #dcdcdc;
    }

    button:active {
      transform: scale(0.96);
    }

    .status {
      text-align: center;
      font-size: 0.9rem;
      color: #777;
      margin-top: 12px;
    }

    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .day-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .session {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
    }

    .person-name {
      font-weight: bold;
    }

    .time {
      color: #777;
      text-align: right;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: #f2f2f2;
      padding: 15px 10px;
      border-radius: 14px;
      text-align: center;
    }

    .stat-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-time {
      color: #666;
      font-size: 0.9rem;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 15px;
    }

    /* DOOMER MODE */

    body.doomer-mode {
      background: #0d0d0f;
      color: #eeeeee;
    }

    body.doomer-mode .card {
      background: #19191c;
      box-shadow: 0 3px 15px rgba(0,0,0,0.4);
    }

    body.doomer-mode .subtitle,
    body.doomer-mode .since,
    body.doomer-mode .status,
    body.doomer-mode .time,
    body.doomer-mode .stat-time {
      color: #999;
    }

    body.doomer-mode button {
      background: #29292e;
      color: #eeeeee;
    }

    body.doomer-mode button:hover {
      background: #38383e;
    }

    body.doomer-mode .stat {
      background: #242428;
    }

    body.doomer-mode .history-item {
      border-bottom-color: #333;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .session {
        flex-direction: column;
        gap: 2px;
      }

      .time {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>what the hell is going on</h1>

    <div class="subtitle">
i don't belong here...    </div>

    <!-- CURRENT DRIVER -->
    <div class="card current">

      <div>Currently driving:</div>

      <div id="currentDriver" class="current-name">
        Loading...
      </div>

      <div id="since" class="since"></div>

      <div class="buttons">
        <button onclick="setDriver('Puppy')">
          🐶 Puppy
        </button>

        <button onclick="setDriver('Doomer')">
          🖤 Doomer
        </button>

        <button onclick="setDriver('N')">
          N
        </button>
      </div>

      <div id="status" class="status">
        Connecting...
      </div>

    </div>


    <!-- STATS -->
    <div class="card">

      <h2>Time driving</h2>

      <div id="stats" class="stats">
        Loading...
      </div>

    </div>


    <!-- HISTORY -->
    <div class="card">

      <h2>History</h2>

      <div id="history">
        Loading...
      </div>

    </div>

  </div>


  <script>

    /*
      SUPABASE SETUP
    */

    const SUPABASE_URL =
      "https://knkneedyoilbgekqluqq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ioDgPFsRSgTM3-vpyZiazg_gZSfzoEb";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
      START APP
    */

    async function loadApp() {

      setStatus("Connecting...");

      await loadCurrentDriver();
      await loadHistory();
      await loadStats();

      setStatus("Connected");
    }


    /*
      GET CURRENT DRIVER
    */

    async function loadCurrentDriver() {

      const { data, error } = await supabaseClient
        .from("driving_sessions")
        .select(`
          id,
          started_at,
          person_id,
          people (
            name
          )
        `)
        .is("ended_at", null)
        .order("started_at", {
          ascending: false
        })
        .limit(1);

      if (error) {

        console.error(error);

        document.getElementById("currentDriver").textContent =
          "Error";

        setStatus("Couldn't connect to Supabase");

        return;
      }


      const driverElement =
        document.getElementById("currentDriver");

      const sinceElement =
        document.getElementById("since");


      if (!data || data.length === 0) {

        driverElement.textContent =
          "Nobody yet";

        sinceElement.textContent =
          "";

        document.body.classList.remove("doomer-mode");

        return;
      }


      const session = data[0];

      const name =
        session.people.name;

      driverElement.textContent =
        name;

      sinceElement.textContent =
        "Since " + formatDateTime(session.started_at);


      /*
        DOOMER DARK MODE
      */

      if (name === "Doomer") {

        document.body.classList.add("doomer-mode");

      } else {

        document.body.classList.remove("doomer-mode");

      }
    }


    /*
      CHANGE DRIVER
    */

    async function setDriver(name) {

      setStatus("Saving...");


      /*
        Find the person
      */

      const { data: person, error: personError } =
        await supabaseClient
          .from("people")
          .select("id, name")
          .eq("name", name)
          .single();


      if (personError) {

        console.error(personError);

        setStatus("Couldn't find " + name);

        return;
      }


      /*
        Close every currently-open driving session
      */

      const { error: closeError } =
        await supabaseClient
          .from("driving_sessions")
          .update({
            ended_at: new Date().toISOString()
          })
          .is("ended_at", null);


      if (closeError) {

        console.error(closeError);

        setStatus(
          "Couldn't close previous session"
        );

        return;
      }


      /*
        Start the new session
      */

      const { error: insertError } =
        await supabaseClient
          .from("driving_sessions")
          .insert({
            person_id: person.id,
            started_at: new Date().toISOString()
          });


      if (insertError) {

        console.error(insertError);

        setStatus(
          "Couldn't save: " + insertError.message
        );

        return;
      }


      /*
        Everything worked.
        Reload the screen.
      */

      await loadApp();
    }


    /*
      LOAD HISTORY
    */

    async function loadHistory() {

      const historyElement =
        document.getElementById("history");


      const { data, error } =
        await supabaseClient
          .from("driving_sessions")
          .select(`
            id,
            started_at,
            ended_at,
            people (
              name
            )
          `)
          .order("started_at", {
            ascending: false
          })
          .limit(500);


      if (error) {

        console.error(error);

        historyElement.innerHTML =
          '<div class="empty">Couldn\'t load history.</div>';

        return;
      }


      if (!data || data.length === 0) {

        historyElement.innerHTML =
          '<div class="empty">No history yet.</div>';

        return;
      }


      /*
        Group sessions by day
      */

      const groups = {};


      data.forEach(session => {

        const date =
          new Date(session.started_at);

        const key =
          date.toLocaleDateString();

        if (!groups[key]) {
          groups[key] = [];
        }

        groups[key].push(session);
      });


      let html = "";


      Object.keys(groups).forEach(key => {

        const sessions =
          groups[key];

        const firstDate =
          new Date(sessions[0].started_at);


        html += `
          <div class="history-item">

            <div class="day-title">
              ${formatDay(firstDate)}
            </div>
        `;


        sessions.forEach(session => {

          const person =
            session.people
              ? session.people.name
              : "Unknown";


          const start =
            formatTime(session.started_at);


          const end =
            session.ended_at
              ? formatTime(session.ended_at)
              : "now";


          html += `
            <div class="session">

              <div class="person-name">
                ${escapeHtml(person)}
              </div>

              <div class="time">
                ${start} – ${end}
              </div>

            </div>
          `;
        });


        html += `
          </div>
        `;
      });


      historyElement.innerHTML =
        html;
    }


    /*
      LOAD TOTAL TIME STATS
    */

    async function loadStats() {

      const statsElement =
        document.getElementById("stats");


      const { data, error } =
        await supabaseClient
          .from("driving_sessions")
          .select(`
            started_at,
            ended_at,
            people (
              name
            )
          `);


      if (error) {

        console.error(error);

        statsElement.innerHTML =
          '<div class="empty">Couldn\'t load stats.</div>';

        return;
      }


      const totals = {
        Puppy: 0,
        Doomer: 0,
        N: 0
      };


      const now =
        Date.now();


      data.forEach(session => {

        if (!session.people) {
          return;
        }


        const name =
          session.people.name;


        const start =
          new Date(session.started_at)
            .getTime();


        const end =
          session.ended_at
            ? new Date(session.ended_at).getTime()
            : now;


        const duration =
          Math.max(0, end - start);


        if (totals[name] !== undefined) {

          totals[name] += duration;
        }
      });


      statsElement.innerHTML = `

        <div class="stat">
          <div class="stat-name">🐶 Puppy</div>
          <div class="stat-time">
            ${formatDuration(totals.Puppy)}
          </div>
        </div>

        <div class="stat">
          <div class="stat-name">🖤 Doomer</div>
          <div class="stat-time">
            ${formatDuration(totals.Doomer)}
          </div>
        </div>

        <div class="stat">
          <div class="stat-name">N</div>
          <div class="stat-time">
            ${formatDuration(totals.N)}
          </div>
        </div>

      `;
    }


    /*
      STATUS MESSAGE
    */

    function setStatus(message) {

      document.getElementById("status")
        .textContent = message;
    }


    /*
      FORMAT TIME
    */

    function formatTime(timestamp) {

      return new Date(timestamp)
        .toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        });
    }


    /*
      FORMAT DATE + TIME
    */

    function formatDateTime(timestamp) {

      return new Date(timestamp)
        .toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });
    }


    /*
      FORMAT DAY
    */

    function formatDay(date) {

      const today =
        new Date();

      const yesterday =
        new Date();

      yesterday.setDate(
        yesterday.getDate() - 1
      );


      if (
        date.toLocaleDateString() ===
        today.toLocaleDateString()
      ) {
        return "Today";
      }


      if (
        date.toLocaleDateString() ===
        yesterday.toLocaleDateString()
      ) {
        return "Yesterday";
      }


      return date.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }


    /*
      FORMAT DURATION
    */

    function formatDuration(milliseconds) {

      const totalMinutes =
        Math.floor(
          milliseconds / 60000
        );


      if (totalMinutes < 1) {
        return "less than a minute";
      }


      const hours =
        Math.floor(
          totalMinutes / 60
        );


      const minutes =
        totalMinutes % 60;


      if (hours === 0) {
        return minutes + " min";
      }


      if (minutes === 0) {
        return hours + " hr";
      }


      return (
        hours +
        " hr " +
        minutes +
        " min"
      );
    }


    /*
      BASIC HTML SAFETY
    */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;
    }


    /*
      START EVERYTHING
    */

    loadApp();

  </script>

</body>
</html>
